<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Validador de Documentos | Arquidiócesis de Maracaibo</title>
    <meta content="Sistema de verificación y validación legal de documentos de la Arquidiócesis de Maracaibo." name="description">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/stitch-config.js"></script>
    <!-- Core Styles -->
    <link href="css/stitch-core.css" rel="stylesheet">
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .validation-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(220, 200, 190, 0.3);
            box-shadow: 0 10px 30px -5px rgba(122, 26, 34, 0.05);
        }
        .verified-badge {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .invalid-badge {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body class="bg-[#fbf9f4] min-h-screen flex flex-col">

<!-- Stitch Layout Placeholder for Navbar -->
<div id="stitch-navbar"></div>

<main class="flex-grow w-full max-w-4xl mx-auto px-margin-mobile md:px-gutter py-12 flex flex-col justify-center items-center">
    
    <div class="w-full text-center mb-8">
        <span class="px-3 py-1 text-[11px] font-bold bg-gold-antique/10 text-gold-antique border border-gold-antique/20 rounded-full uppercase tracking-widest font-label">Seguridad Eclesiástica</span>
        <h1 class="font-display text-[32px] md:text-[40px] font-bold text-crimson-deep mt-2 leading-tight">Validador de Documentos Oficiales</h1>
        <p class="font-body text-[14px] text-slate-warm max-w-xl mx-auto mt-2">Verifique la autenticidad e integridad legal de las constancias parroquiales y resoluciones de Cancillería emitidas digitalmente.</p>
    </div>

    <!-- Search Form -->
    <div class="w-full max-w-2xl bg-white/70 backdrop-blur-md p-6 rounded-2xl border border-outline-variant/30 shadow-md">
        <div class="flex flex-col md:flex-row gap-3">
            <div class="relative flex-grow">
                <i class="ti ti-qrcode absolute left-4 top-1/2 -translate-y-1/2 text-slate-warm/60 text-[20px]"></i>
                <input type="text" id="verif-code" class="w-full bg-warm-ivory/50 border-2 border-outline-variant/50 focus:border-crimson-deep focus:ring-0 outline-none pl-12 pr-4 py-3.5 transition-all font-body text-[14px] rounded-xl" placeholder="Ingrese el código de registro (Ej. CP-PZ1-1-2026-REQ-1001)...">
            </div>
            <button onclick="validateCode()" class="bg-crimson-deep text-white px-8 py-3.5 rounded-xl font-bold font-label text-[14px] hover:bg-primary hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 uppercase tracking-wide">
                <i class="ti ti-shield-check text-[18px]"></i> Verificar
            </button>
        </div>
    </div>

    <!-- Results Area -->
    <div id="validation-result" class="w-full max-w-2xl mt-8 hidden animate-fadeIn">
        <!-- Rendered dynamically -->
    </div>

</main>

<!-- Stitch Layout Placeholder for Footer -->
<div id="stitch-footer"></div>

<script src="js/stitch-components.js"></script>
<script>
    StitchLayout.init({ activePage: 'validar' });
</script>

<script>
    let supabaseClient = null;
    let isSupabase = false;
    let db = { requests: [], parroquias: [] };

    // Initialize DB connection
    async function initDB() {
        try {
            const configRes = await fetch('/api/config');
            const config = await configRes.json().catch(() => ({}));

            if (config.supabaseUrl && config.supabaseAnonKey && window.supabase) {
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                isSupabase = true;
                console.log("Conectado con éxito a Supabase.");
            }
        } catch (err) {
            console.warn("Fallo al conectar con la API de configuración. Se usará LocalStorage.", err);
        }

        if (!isSupabase) {
            let savedDb = localStorage.getItem('cancilleria_db');
            if (savedDb) {
                try {
                    db = JSON.parse(savedDb);
                } catch (e) {
                    console.error("Error al parsear la base de datos local:", e);
                }
            }
        }
    }

    // Main validation function
    async function validateCode(codeVal) {
        const inputCode = (codeVal || document.getElementById('verif-code').value).trim();
        if (!inputCode) return;

        // Sync input field value
        document.getElementById('verif-code').value = inputCode;

        // Show spinner
        const resultDiv = document.getElementById('validation-result');
        resultDiv.innerHTML = `
            <div class="validation-card p-10 text-center flex flex-col items-center justify-center gap-4">
                <i class="ti ti-loader animate-spin text-[32px] text-crimson-deep"></i>
                <p class="font-body text-[14px] text-slate-warm">Consultando los libros de registro digital de la Arquidiócesis...</p>
            </div>
        `;
        resultDiv.classList.remove('hidden');

        // Extract ID
        let reqId = null;
        let isParishCertificate = false;
        const cleanCode = inputCode.toUpperCase();

        if (cleanCode.startsWith('REQ-')) {
            reqId = cleanCode;
        } else if (cleanCode.includes('REQ-')) {
            const match = cleanCode.match(/REQ-\d+/);
            if (match) {
                reqId = match[0];
                isParishCertificate = true;
            }
        } else if (cleanCode.startsWith('CP-')) {
            // Check for numeric part at the end
            const match = cleanCode.match(/\d+$/);
            if (match) {
                reqId = "REQ-" + match[0];
                isParishCertificate = true;
            }
        }

        if (!reqId) {
            showInvalidDocument("El formato del código es inválido. Por favor, asegúrese de ingresar el código completo con formato REQ-XXXX o CP-XXXX.");
            return;
        }

        let req = null;
        if (isSupabase) {
            try {
                const { data, error } = await supabaseClient
                    .from('tramites')
                    .select('*')
                    .eq('id', reqId)
                    .single();
                if (data) {
                    // Map Supabase fields
                    req = {
                        id: data.id,
                        priestName: data.priest_name,
                        priestEmail: data.priest_email,
                        type: data.type,
                        date: data.date,
                        subject: data.subject,
                        parish: data.parish,
                        details: data.details,
                        status: data.status,
                        feedback: data.feedback,
                        documentContent: data.document_content,
                        priestFileContent: data.priest_file_content
                    };
                }
            } catch (err) {
                console.error("Error al consultar Supabase:", err);
            }
        } else {
            req = db.requests.find(r => r.id === reqId);
        }

        if (!req) {
            showInvalidDocument(`No se encontró ningún trámite registrado con el ID ${reqId}. Es posible que no exista o haya sido borrado.`);
            return;
        }

        if (isParishCertificate) {
            showValidParishCertificate(req, inputCode);
        } else {
            if (req.status !== 'Aprobado') {
                showInvalidDocument(`La solicitud ${reqId} está en estado "${req.status}". Las resoluciones solo son válidas una vez aprobadas y selladas por la Cancillería.`);
                return;
            }
            showValidResolution(req);
        }
    }

    function showInvalidDocument(errorMsg) {
        const resultDiv = document.getElementById('validation-result');
        resultDiv.innerHTML = `
            <div class="validation-card overflow-hidden">
                <div class="invalid-badge p-6 flex items-center justify-center gap-3 font-label font-bold text-[14px] uppercase tracking-wider">
                    <i class="ti ti-shield-x text-[22px]"></i> Documento no verificado
                </div>
                <div class="p-8 text-center">
                    <p class="font-body text-[14px] text-slate-warm leading-relaxed mb-4">${errorMsg}</p>
                    <div class="text-[12px] text-slate-400 font-mono">Verificación fallida · Servidor de Cancillería</div>
                </div>
            </div>
        `;
    }

    function showValidResolution(req) {
        const resultDiv = document.getElementById('validation-result');
        resultDiv.innerHTML = `
            <div class="validation-card overflow-hidden animate-fadeIn">
                <div class="verified-badge p-6 flex items-center justify-center gap-3 font-label font-bold text-[14px] uppercase tracking-wider">
                    <i class="ti ti-shield-check text-[22px]"></i> Documento Válido y Auténtico
                </div>
                
                <div class="p-8">
                    <div class="border-b border-slate-100 pb-4 mb-6">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest font-label block">Certificación de Cancillería</span>
                        <h3 class="font-display text-[22px] font-bold text-slate-warm mt-1">${req.type}</h3>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 font-body text-[13px]">
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Código de Verificación:</span>
                            <strong class="text-slate-warm font-mono text-[14px]">${req.id}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Fecha de Emisión:</span>
                            <strong class="text-slate-warm">${formatDateToLocale(req.date)}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Sacerdote / Parroquia Solicitante:</span>
                            <strong class="text-slate-warm">${req.priestName}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Asignación / Parroquia:</span>
                            <strong class="text-slate-warm">${req.parish}</strong>
                        </div>
                    </div>

                    <div class="bg-surface-container-low p-6 rounded-xl border border-outline-variant/10 font-body text-[13px] text-slate-warm leading-relaxed mb-6">
                        <span class="text-[10px] font-bold text-crimson-deep uppercase tracking-widest font-label block mb-3 border-b border-outline-variant/20 pb-1.5">Texto Oficial Resolutivo</span>
                        <div class="font-serif whitespace-pre-line text-slate-900 text-justify text-[13.5px] leading-relaxed" style="font-family: Georgia, serif;">${req.documentContent || 'Sin contenido de resolución.'}</div>
                    </div>

                    <div class="text-center text-[11px] text-slate-400 font-mono">
                        Validación digital verificada con éxito el ${new Date().toLocaleDateString('es-ES')}
                    </div>
                </div>
            </div>
        `;
    }

    function showValidParishCertificate(req, originalCode) {
        const resultDiv = document.getElementById('validation-result');
        
        // Let's check if there is a digital certificate text saved in files
        let constanciaText = "";
        let interesados = "N/A";
        
        if (req.priestFileContent) {
            try {
                const files = JSON.parse(req.priestFileContent);
                const digitalCert = files.find(f => f.fileName && f.fileName.startsWith('Constancia_Digital_'));
                if (digitalCert && digitalCert.textContent) {
                    constanciaText = digitalCert.textContent;
                }
            } catch(e) {
                console.error("Error reading attachments for certificate text:", e);
            }
        }

        // Try extracting interested name from subject
        if (req.subject && req.subject.includes(' - ')) {
            interesados = req.subject.split(' - ')[1];
        } else if (req.details && req.details.includes('Interesado: ')) {
            const match = req.details.match(/Interesado:\s*([^\n]+)/);
            if (match) interesados = match[1].trim();
        }

        resultDiv.innerHTML = `
            <div class="validation-card overflow-hidden animate-fadeIn">
                <div class="verified-badge p-6 flex items-center justify-center gap-3 font-label font-bold text-[14px] uppercase tracking-wider">
                    <i class="ti ti-shield-check text-[22px]"></i> Documento Válido y Auténtico
                </div>
                
                <div class="p-8">
                    <div class="border-b border-slate-100 pb-4 mb-6">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest font-label block">Constancia Parroquial Digital</span>
                        <h3 class="font-display text-[22px] font-bold text-slate-warm mt-1">Constancia de ${req.type.replace('Solicitud de ', '')}</h3>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 font-body text-[13px]">
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Código de Verificación:</span>
                            <strong class="text-slate-warm font-mono text-[14px]">${originalCode}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Fecha de Emisión:</span>
                            <strong class="text-slate-warm">${formatDateToLocale(req.date)}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Parroquia Emisora:</span>
                            <strong class="text-slate-warm">${req.parish}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Interesado / Solicitante:</span>
                            <strong class="text-slate-warm">${interesados}</strong>
                        </div>
                    </div>

                    <div class="bg-surface-container-low p-6 rounded-xl border border-outline-variant/10 font-body text-[13px] text-slate-warm leading-relaxed mb-6">
                        <span class="text-[10px] font-bold text-crimson-deep uppercase tracking-widest font-label block mb-3 border-b border-outline-variant/20 pb-1.5">Texto Certificado Parroquial</span>
                        <div class="font-sans whitespace-pre-line text-slate-900 text-justify text-[13.5px] leading-relaxed" style="font-family: Arial, sans-serif;">
                            ${constanciaText || `Certificamos que se ha registrado una solicitud digital en esta parroquia el día ${formatDateToLocale(req.date)} para el trámite de ${req.type}.\n\nDetalles del Trámite:\n${req.details}`}
                        </div>
                    </div>

                    <div class="text-center text-[11px] text-slate-400 font-mono">
                        Validación digital verificada con éxito el ${new Date().toLocaleDateString('es-ES')}
                    </div>
                </div>
            </div>
        `;
    }

    function formatDateToLocale(dateStr) {
        if (!dateStr) return '';
        try {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        } catch (e) {
            return dateStr;
        }
    }

    // Auto load validation if URL parameter is present
    window.addEventListener('load', async () => {
        await initDB();
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
            validateCode(code);
        }
    });
</script>
</body>
</html>
