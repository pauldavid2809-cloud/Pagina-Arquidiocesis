    // Initialize DB connection
    async function initDB() {
        try {
            const configRes = await fetch('/api/config');
            const config = await configRes.json().catch(() => ({}));

            if (config.supabaseUrl && config.supabaseAnonKey && window.supabase) {
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                isSupabase = true;
                console.log("Conectado con éxito a Supabase.");
            }
        } catch (err) {
            console.warn("Fallo al conectar con la API de configuración. Se usará LocalStorage.", err);
        }

        if (!isSupabase) {
            let savedDb = localStorage.getItem('cancilleria_db');
            if (savedDb) {
                try {
                    db = JSON.parse(savedDb);
                } catch (e) {
                    console.error("Error al parsear la base de datos local:", e);
                }
            }
        }

        // Cargar Parroquias desde el listado autogenerado para nombres de párrocos
        try {
            const parishesRes = await fetch('parishes.json');
            if (parishesRes.ok) {
                db.parroquias = await parishesRes.json();
                console.log("Parroquias cargadas en validar:", db.parroquias.length);
            }
        } catch (e) {
            console.error("Error al cargar parishes.json en validar:", e);
        }

        // Cargar Seminaristas desde el listado local autogenerado
        try {
            const semRes = await fetch('seminaristas.json');
            if (semRes.ok) {
                db.seminaristas = await semRes.json();
                console.log("Seminaristas cargados en validar:", db.seminaristas.length);
            }
        } catch (e) {
            console.error("Error al cargar seminaristas.json en validar:", e);
        }

    }

    // Main validation function
    async function validateCode(codeVal) {
        const inputCode = (codeVal || document.getElementById('verif-code').value).trim();
        if (!inputCode) return;

        // Sync input field value
        document.getElementById('verif-code').value = inputCode;

        // Normalize input for seminarian search (remove spaces, dots, hyphens)
        let cleanCode = inputCode.toUpperCase().replace(/[^0-9VEA-Z]/g, '');
        let cleanNum = inputCode.replace(/[^0-9]/g, '');

        // Corrección de códigos QR impresos con errata en algunos carnets físicos
        // (el QR codifica una cédula equivocada; el resto del carnet es correcto)
        const QR_ERRATAS = {
            'SEMV18200259': 'SEMV18200859', // Pbro. José Varela: QR dice ...259, cédula real ...859
            'SEMV23567447': 'SEMV32567447'  // Luis Polanco: QR dice 23..., cédula real 32...
        };
        if (QR_ERRATAS[cleanCode]) {
            cleanCode = QR_ERRATAS[cleanCode];
            cleanNum = cleanCode.replace(/[^0-9]/g, '');
        }

        // Check if it matches a seminarian in our JSON database
        let foundSem = (db.seminaristas || []).find(s => {
            const semIdClean = s.id.toUpperCase().replace(/[^0-9VEA-Z]/g, '');
            const semCedClean = s.cedula.toUpperCase().replace(/[^0-9]/g, '');
            return semIdClean === cleanCode || semCedClean === cleanNum || (cleanNum && semCedClean.includes(cleanNum));
        });

        if (foundSem) {
            // Show spinner briefly for aesthetic load
            const resultDiv = document.getElementById('validation-result');
            resultDiv.innerHTML = `
                <div class="validation-card p-10 text-center flex flex-col items-center justify-center gap-4">
                    <i class="ti ti-loader animate-spin text-[32px] text-crimson-deep"></i>
                    <p class="font-body text-[14px] text-slate-warm">Consultando los libros de registro digital de la Arquidiócesis...</p>
                </div>
            `;
            resultDiv.classList.remove('hidden');
            setTimeout(() => {
                showValidSeminarian(foundSem);
            }, 500);
            return;
        }

        // If explicitly trying to validate a seminarian but not found
        if (cleanCode.startsWith('SEM') || inputCode.toUpperCase().includes('SEM-')) {
            showInvalidDocument(`No se encontró ningún seminarista registrado con la cédula o código "${inputCode}". Verifique los datos.`);
            return;
        }

        // Show spinner
        const resultDiv = document.getElementById('validation-result');
        resultDiv.innerHTML = `
            <div class="validation-card p-10 text-center flex flex-col items-center justify-center gap-4">
                <i class="ti ti-loader animate-spin text-[32px] text-crimson-deep"></i>
                <p class="font-body text-[14px] text-slate-warm">Consultando los libros de registro digital de la Arquidiócesis...</p>
            </div>
        `;
        resultDiv.classList.remove('hidden');

        // Extract ID
        let reqId = null;
        let isParishCertificate = false;
        const cleanCodeReq = inputCode.toUpperCase();

        if (cleanCodeReq.startsWith('REQ-')) {
            reqId = cleanCodeReq;
        } else if (cleanCodeReq.includes('REQ-')) {
            const match = cleanCodeReq.match(/REQ-\d+/);
            if (match) {
                reqId = match[0];
                isParishCertificate = true;
            }
        } else if (cleanCodeReq.startsWith('CP-')) {
            // Check for numeric part at the end
            const match = cleanCodeReq.match(/\d+$/);
            if (match) {
                reqId = "REQ-" + match[0];
                isParishCertificate = true;
            }
        }

        if (!reqId) {
            showInvalidDocument("El formato del código es inválido. Por favor, asegúrese de ingresar el código completo con formato REQ-XXXX, CP-XXXX o el carnet del seminarista.");
            return;
        }

        let req = null;
        if (isSupabase) {
            try {
                const { data, error } = await supabaseClient
                    .from('tramites')
                    .select('*')
                    .eq('id', reqId)
                    .single();
                if (data) {
                    // Map Supabase fields
                    req = {
                        id: data.id,
                        priestName: data.priest_name,
                        priestEmail: data.priest_email,
                        type: data.type,
                        date: data.date,
                        subject: data.subject,
                        parish: data.parish,
                        details: data.details,
                        status: data.status,
                        feedback: data.feedback,
                        documentContent: data.document_content,
                        priestFileContent: data.priest_file_content
                    };
                }
            } catch (err) {
                console.error("Error al consultar Supabase:", err);
            }
        } else {
            req = db.requests.find(r => r.id === reqId);
        }

        if (!req) {
            showInvalidDocument(`No se encontró ningún trámite registrado con el ID ${reqId}. Es posible que no exista o haya sido borrado.`);
            return;
        }

        if (isParishCertificate) {
            showValidParishCertificate(req, inputCode);
        } else {
            if (req.status !== 'Aprobado') {
                showInvalidDocument(`La solicitud ${reqId} está en estado "${req.status}". Las resoluciones solo son válidas una vez aprobadas y selladas por la Cancillería.`);
                return;
            }
            showValidResolution(req);
        }
    }

    function showValidSeminarian(sem) {
        const resultDiv = document.getElementById('validation-result');

        // --- Expiration handling ---
        const MESES = { '01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre' };
        let expiraDisplay = sem.expira || 'No registrada';
        let vigente = true;
        const expMatch = (sem.expira || '').match(/^(\d{2})\/(\d{2,4})$/);
        if (expMatch) {
            const mm = expMatch[1];
            const yyyy = expMatch[2].length === 2 ? '20' + expMatch[2] : expMatch[2];
            expiraDisplay = `${MESES[mm] || mm} de ${yyyy}`;
            const now = new Date();
            vigente = now < new Date(parseInt(yyyy), parseInt(mm), 1); // valid through end of expiry month
        }

        const esFormador = !!sem.cargo;
        const condicion = esFormador ? sem.etapa : `Estudiante de ${sem.etapa}`;
        const diocesis = sem.diocesis_procedencia || 'Arquidiócesis de Maracaibo';

        const photoHtml = sem.foto
            ? `<img src="${sem.foto}" alt="Fotografía de ${sem.nombre}" class="w-full h-full object-cover rounded-full" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center rounded-full text-[#C59B27]\\'><i class=\\'ti ti-user text-[52px]\\'></i></div>';">`
            : `<div class="w-full h-full flex items-center justify-center rounded-full text-[#C59B27]"><i class="ti ti-user text-[52px]"></i></div>`;

        const estadoBanner = vigente
            ? `<div class="verified-badge px-6 py-4 flex items-center justify-center gap-2.5 font-label font-bold text-[13px] uppercase tracking-[0.15em]">
                   <i class="ti ti-rosette-discount-check text-[20px]"></i> Credencial Verificada y Vigente
               </div>`
            : `<div class="invalid-badge px-6 py-4 flex items-center justify-center gap-2.5 font-label font-bold text-[13px] uppercase tracking-[0.15em]">
                   <i class="ti ti-clock-x text-[20px]"></i> Credencial Auténtica · Expirada
               </div>`;

        const dato = (icono, etiqueta, valor, extra = '') => `
            <div class="flex items-start gap-3 ${extra}">
                <div class="w-9 h-9 shrink-0 rounded-lg bg-[#7A1A22]/[0.06] text-[#7A1A22] flex items-center justify-center">
                    <i class="ti ${icono} text-[18px]"></i>
                </div>
                <div class="min-w-0">
                    <span class="text-slate-400 block font-semibold text-[10.5px] uppercase tracking-wider font-label">${etiqueta}</span>
                    <strong class="text-slate-warm text-[13.5px] leading-snug block">${valor}</strong>
                </div>
            </div>`;

        let gridHtml = dato('ti-id-badge-2', 'Cédula de Identidad', `<span class="font-mono">${sem.cedula}</span>`)
            + dato('ti-calendar-event', 'Válido hasta', `${expiraDisplay} <span class="font-mono text-[11px] text-slate-400">(${sem.expira})</span>`);

        if (esFormador) {
            gridHtml += dato('ti-briefcase', 'Cargo / Función', sem.cargo);
            gridHtml += dato('ti-world', 'Jurisdicción', diocesis);
        } else {
            gridHtml += dato('ti-building-church', 'Parroquia de Origen', sem.parroquia || 'No registrada');
            gridHtml += dato('ti-world', 'Diócesis de Procedencia', sem.diocesis_procedencia
                ? `${sem.diocesis_procedencia} <span class="align-middle ml-1 text-[9.5px] font-bold text-white bg-[#C59B27] px-1.5 py-0.5 rounded uppercase tracking-wide">Externa</span>`
                : 'Arquidiócesis de Maracaibo');
        }

        gridHtml += dato('ti-school', 'Institución Formadora', sem.institucion, 'sm:col-span-2');
        gridHtml += dato('ti-user-star', 'Rector', sem.rector || 'No registrado', 'sm:col-span-2');

        resultDiv.innerHTML = `
            <div class="validation-card overflow-hidden animate-fadeIn">
                ${estadoBanner}

                <!-- Institutional header -->
                <div class="relative text-white px-8 pt-7 pb-16 text-center" style="background: linear-gradient(135deg, #131C46 0%, #1E2A66 55%, #7A1A22 160%);">
                    <div class="absolute inset-0 opacity-[0.06] pointer-events-none" style="background-image: radial-gradient(circle at 20% 30%, #fff 1px, transparent 1.5px), radial-gradient(circle at 80% 70%, #fff 1px, transparent 1.5px); background-size: 48px 48px;"></div>
                    <span class="relative text-[10px] font-bold text-[#E4C368] uppercase tracking-[0.25em] font-label block">Seminario Mayor Arquidiocesano</span>
                    <h3 class="relative font-display text-[20px] md:text-[22px] font-bold mt-1 leading-tight">"Santo Tomás de Aquino" · Maracaibo</h3>
                    <span class="relative text-[11px] text-white/70 font-body block mt-1">${esFormador ? 'Credencial Oficial de Formador' : 'Credencial Oficial de Seminarista'} · ${sem.id}</span>
                </div>

                <!-- Photo overlapping header -->
                <div class="relative -mt-14 flex justify-center">
                    <div class="relative">
                        <div class="w-[124px] h-[124px] rounded-full bg-white p-1.5 shadow-lg" style="box-shadow: 0 8px 24px -6px rgba(19,28,70,0.35);">
                            <div class="w-full h-full rounded-full bg-[#f4f1ea] ring-2 ring-[#C59B27]/70 overflow-hidden">
                                ${photoHtml}
                            </div>
                        </div>
                        <div class="absolute bottom-1 right-1 w-8 h-8 rounded-full ${vigente ? 'bg-emerald-600' : 'bg-amber-500'} text-white flex items-center justify-center border-[3px] border-white" title="${vigente ? 'Credencial vigente' : 'Credencial expirada'}">
                            <i class="ti ${vigente ? 'ti-check' : 'ti-clock'} text-[15px]"></i>
                        </div>
                    </div>
                </div>

                <!-- Identity -->
                <div class="text-center px-8 pt-4 pb-2">
                    <h2 class="font-display text-[24px] md:text-[26px] font-bold text-[#131C46] leading-tight">${sem.nombre}</h2>
                    <div class="flex items-center justify-center gap-2 mt-2.5 flex-wrap">
                        <span class="px-3.5 py-1 text-[11px] font-bold text-white bg-[#7A1A22] rounded-full uppercase tracking-wider font-label">${condicion}</span>
                        <span class="px-3.5 py-1 text-[11px] font-bold text-[#7A1A22] bg-[#7A1A22]/[0.07] border border-[#7A1A22]/15 rounded-full uppercase tracking-wider font-label">${diocesis}</span>
                    </div>
                </div>

                <!-- Details -->
                <div class="px-8 pt-5 pb-7">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4 font-body bg-[#fbf9f4] border border-[#C59B27]/15 rounded-2xl p-5">
                        ${gridHtml}
                    </div>

                    <div class="mt-5 pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-slate-400">
                        <div class="flex items-center gap-1.5 font-mono">
                            <i class="ti ti-lock-check text-[14px] text-emerald-600"></i>
                            Verificado contra el registro oficial · ${new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' })}
                        </div>
                        <div class="font-mono text-slate-300">${sem.id}</div>
                    </div>
                </div>
            </div>
        `;
    }

    function showInvalidDocument(errorMsg) {
        const resultDiv = document.getElementById('validation-result');
        resultDiv.innerHTML = `
            <div class="validation-card overflow-hidden">
                <div class="invalid-badge p-6 flex items-center justify-center gap-3 font-label font-bold text-[14px] uppercase tracking-wider">
                    <i class="ti ti-shield-x text-[22px]"></i> Documento no verificado
                </div>
                <div class="p-8 text-center">
                    <p class="font-body text-[14px] text-slate-warm leading-relaxed mb-4">${errorMsg}</p>
                    <div class="text-[12px] text-slate-400 font-mono">Verificación fallida · Servidor de Cancillería</div>
                </div>
            </div>
        `;
    }

    function showValidResolution(req) {
        const resultDiv = document.getElementById('validation-result');
        resultDiv.innerHTML = `
            <div class="validation-card overflow-hidden animate-fadeIn">
                <div class="verified-badge p-6 flex items-center justify-center gap-3 font-label font-bold text-[14px] uppercase tracking-wider">
                    <i class="ti ti-shield-check text-[22px]"></i> Documento Válido y Auténtico
                </div>
                
                <div class="p-8">
                    <div class="border-b border-slate-100 pb-4 mb-6">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest font-label block">Certificación de Cancillería</span>
                        <h3 class="font-display text-[22px] font-bold text-slate-warm mt-1">${req.type}</h3>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 font-body text-[13px]">
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Código de Verificación:</span>
                            <strong class="text-slate-warm font-mono text-[14px]">${req.id}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Fecha de Emisión:</span>
                            <strong class="text-slate-warm">${formatDateToLocale(req.date)}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Sacerdote / Parroquia Solicitante:</span>
                            <strong class="text-slate-warm">${req.priestName}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Asignación / Parroquia:</span>
                            <strong class="text-slate-warm">${req.parish}</strong>
                        </div>
                    </div>

                    <div class="bg-surface-container-low p-6 rounded-xl border border-outline-variant/10 font-body text-[13px] text-slate-warm leading-relaxed mb-6">
                        <span class="text-[10px] font-bold text-crimson-deep uppercase tracking-widest font-label block mb-3 border-b border-outline-variant/20 pb-1.5">Texto Oficial Resolutivo</span>
                        <div class="font-serif whitespace-pre-line text-slate-900 text-justify text-[13.5px] leading-relaxed" style="font-family: Georgia, serif;">${req.documentContent || 'Sin contenido de resolución.'}</div>
                    </div>

                    <div class="text-center text-[11px] text-slate-400 font-mono">
                        Validación digital verificada con éxito el ${new Date().toLocaleDateString('es-ES')}
                    </div>
                </div>
            </div>
        `;
    }

    function showValidParishCertificate(req, originalCode) {
        const resultDiv = document.getElementById('validation-result');
        
        // Let's check if there is a digital certificate text saved in files
        let constanciaText = "";
        let interesados = "N/A";
        
        if (req.priestFileContent) {
            try {
                const files = JSON.parse(req.priestFileContent);
                const digitalCert = files.find(f => f.fileName && f.fileName.startsWith('Constancia_Digital_'));
                if (digitalCert && digitalCert.textContent) {
                    constanciaText = digitalCert.textContent;
                }
            } catch(e) {
                console.error("Error reading attachments for certificate text:", e);
            }
        }

        // Try extracting interested name from subject
        if (req.subject && req.subject.includes(' - ')) {
            interesados = req.subject.split(' - ')[1];
        } else if (req.details) {
            const match = req.details.match(/(?:Interesado|Contrayente\(s\)):\s*([^\n]+)/i);
            if (match) interesados = match[1].trim();
        }

        // Extract parish code from validation code
        let parishCode = "PZ0-0";
        if (originalCode) {
            const parts = originalCode.split('-');
            if (parts.length > 2) {
                parishCode = parts[1];
            }
        }

        // Lookup priest name dynamically in database
        let priestName = "";
        if (parishCode) {
            const parishData = (db.parroquias || []).find(p => p.code === parishCode);
            if (parishData && parishData.parroco) {
                priestName = parishData.parroco;
            }
        }
        if (!priestName) {
            priestName = req.priestName || "Párroco / Administrador";
        }
        if (priestName && !/^(pbro\.|mons\.|r\.p\.|r\.\s*p\.|fray|pbros\.|diac\.)/i.test(priestName)) {
            priestName = "Pbro. " + priestName;
        }

        resultDiv.innerHTML = `
            <div class="validation-card overflow-hidden animate-fadeIn">
                <div class="verified-badge p-6 flex items-center justify-center gap-3 font-label font-bold text-[14px] uppercase tracking-wider">
                    <i class="ti ti-shield-check text-[22px]"></i> Documento Válido y Auténtico
                </div>
                
                <div class="p-8">
                    <div class="border-b border-slate-100 pb-4 mb-6">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest font-label block">Constancia Parroquial Digital</span>
                        <h3 class="font-display text-[22px] font-bold text-slate-warm mt-1">Constancia de ${req.type.replace('Solicitud de ', '').replace('Solicitud por ', '')}</h3>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 font-body text-[13px]">
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Código de Verificación:</span>
                            <strong class="text-slate-warm font-mono text-[14px]">${originalCode}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Fecha de Emisión:</span>
                            <strong class="text-slate-warm">${formatDateToLocale(req.date)}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Parroquia Emisora:</span>
                            <strong class="text-slate-warm">${req.parish}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block font-semibold text-[11px] uppercase tracking-wider">Interesado / Solicitante:</span>
                            <strong class="text-slate-warm">${interesados}</strong>
                        </div>
                    </div>

                    <!-- Facsímil Impreso Premium -->
                    <div class="mt-8 border-[12px] border-double border-[#C59B27]/40 bg-[#fffdf9] text-[#2b2518] p-8 rounded-lg relative overflow-hidden shadow-inner text-[12px] leading-relaxed" style="font-family: Arial, sans-serif;">
                        <!-- Background Watermark -->
                        <div class="absolute inset-0 flex items-center justify-center opacity-[0.025] pointer-events-none z-0">
                            <img src="data:image/webp;base64,${logoBase64}" alt="Watermark" class="w-full max-w-[220px] object-contain">
                        </div>

                        <div class="relative z-10 flex flex-col justify-between h-full">
                            <header class="text-center mb-6">
                                <img src="data:image/webp;base64,${logoBase64}" alt="Logo" class="mx-auto mb-2" style="width: 50px; height: 50px;" onerror="this.src='https://placehold.co/50x50/7A1A22/ffffff?text=AM'">
                                <h4 class="font-bold text-[14px] text-[#7A1A22] uppercase tracking-[0.12em] border-b-2 border-[#C59B27]/30 pb-2.5 mb-1.5" style="font-family: Arial, sans-serif;">Arquidiócesis de Maracaibo</h4>
                                <h5 class="text-[11px] italic text-slate-500 font-medium mt-1">${req.parish}</h5>
                            </header>
                            
                            <article class="text-justify px-2 mb-6">
                                <h6 class="text-center font-bold text-[12px] text-[#7A1A22] mb-5 uppercase tracking-wider">${req.type}</h6>
                                <div class="whitespace-pre-line text-[11px] text-[#2b2518]">
                                    ${constanciaText || `Certificamos que se ha registrado una solicitud digital en esta parroquia el día ${formatDateToLocale(req.date)} para el trámite de ${req.type}.\n\nDetalles del Trámite:\n${req.details}`}
                                </div>
                            </article>
                            
                            <footer class="mt-4">
                                <div class="flex justify-between items-end gap-4 px-2 mb-4">
                                    <div class="text-center flex-1">
                                        <div class="border-t border-slate-300 pt-1.5 text-[10px] font-bold text-[#4a3e26]">${priestName}</div>
                                        <div class="text-[8.5px] text-slate-400 uppercase tracking-wider font-semibold">Párroco / Administrador</div>
                                    </div>
                                    <div class="text-center shrink-0" style="width: 75px;">
                                        <div style="border: 2px dashed #9c2b2b; color: #9c2b2b; font-size: 7.5px; border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; text-transform: uppercase; font-weight: bold; transform: rotate(-8deg); margin: 0 auto; line-height: 1.2; padding: 2px; background: rgba(255, 255, 255, 0.85);">
                                            <span>Sello<br>Parroquia<br>${parishCode}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="border-t border-[#C59B27]/20 pt-3 flex justify-between items-center text-[8.5px] text-slate-400">
                                    <div>Código de Verificación: <strong class="font-mono text-[9px] text-[#7A1A22]">${originalCode}</strong></div>
                                    <div class="opacity-75">Validez legal mediante verificación digital diocesana.</div>
                                </div>
                            </footer>
                        </div>
                    </div>

                    <div class="mt-6 text-center text-[11px] text-slate-400 font-mono">
                        Validación digital verificada con éxito el ${new Date().toLocaleDateString('es-ES')}
                    </div>
                </div>
            </div>
        `;
    }

    function formatDateToLocale(dateStr) {
        if (!dateStr) return '';
        try {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        } catch (e) {
            return dateStr;
        }
    }

    // Auto load validation if URL parameter is present
    window.addEventListener('load', async () => {
        await initDB();
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
            validateCode(code);
        }
    });
</script>
</body>
</html>
