<!DOCTYPE html><html class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Gestión de Noticias | Arquidiócesis de Maracaibo</title>
<meta content="Panel para publicar noticias en el sitio de la Arquidiócesis de Maracaibo." name="description">
<meta name="robots" content="noindex, nofollow">
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="css/tailwind.css" rel="stylesheet">
<link href="css/stitch-core.css" rel="stylesheet">
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .field-label { font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; color:#4A4543; margin-bottom:.35rem; display:block; }
  .field-input {
    width:100%; background:#F9F7F2; border:1px solid rgba(221,192,190,.55); border-radius:.6rem;
    padding:.65rem .9rem; font-family:'Poppins',sans-serif; font-size:14px; color:#1b1c19; outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .field-input:focus { border-color:#7A1A22; box-shadow:0 0 0 3px rgba(122,26,34,.1); }
  textarea.field-input { min-height:120px; resize:vertical; }
  .btn-primary {
    background:#7A1A22; color:#fff; border:none; border-radius:9999px; padding:.7rem 1.6rem;
    font-family:'Poppins',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all .15s;
    display:inline-flex; align-items:center; gap:.5rem;
  }
  .btn-primary:hover { background:#5b000f; }
  .btn-primary:disabled { opacity:.55; cursor:not-allowed; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100;
    padding:.85rem 1.4rem; border-radius:.7rem; color:#fff; font-family:'Poppins',sans-serif; font-size:14px;
    font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(-4px); }
  .toast.ok { background:#166534; } .toast.err { background:#b91c1c; }
  #photo-preview { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:.6rem; background:#f0eee9; display:none; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<div id="stitch-navbar"></div>

<main id="contenido" class="max-w-container-max mx-auto px-margin-mobile md:px-gutter py-10">

  <!-- ── LOGIN ─────────────────────────────────────────── -->
  <section id="login-view" class="max-w-md mx-auto mt-10">
    <div class="text-center mb-8">
      <span class="material-symbols-outlined text-5xl text-crimson-deep">newspaper</span>
      <h1 class="font-headline text-headline-lg-mobile text-crimson-deep mt-2">Gestión de Noticias</h1>
      <p class="font-body text-[14px] text-slate-warm mt-1">Ingrese con su cuenta de editor para publicar.</p>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/15 p-7">
      <form id="login-form" class="space-y-4">
        <div>
          <label class="field-label" for="login-email">Correo electrónico</label>
          <input class="field-input" id="login-email" type="email" autocomplete="username" required placeholder="editor@arquidiocesisdemaracaibo.org">
        </div>
        <div>
          <label class="field-label" for="login-pass">Contraseña</label>
          <input class="field-input" id="login-pass" type="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <p id="login-error" class="text-[13px] text-red-700 font-semibold" style="display:none"></p>
        <button class="btn-primary w-full justify-center" id="login-btn" type="submit">
          <span class="material-symbols-outlined text-[18px]">login</span> Entrar
        </button>
      </form>
    </div>
  </section>

  <!-- ── PANEL ─────────────────────────────────────────── -->
  <section id="panel-view" style="display:none">
    <div class="flex flex-wrap justify-between items-end gap-4 mb-8">
      <div>
        <span class="font-label text-sm text-gold-antique tracking-widest uppercase">Panel de redes</span>
        <h1 class="font-headline text-headline-lg-mobile md:text-headline-lg text-crimson-deep">Noticias del sitio</h1>
        <p class="font-body text-[14px] text-slate-warm mt-1">Sesión: <strong id="who"></strong></p>
      </div>
      <button class="text-crimson-deep font-label text-[13px] font-bold border-b border-crimson-deep pb-0.5" onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
      <!-- Formulario -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-sm border border-outline-variant/15 p-6 lg:sticky lg:top-24">
          <h2 class="font-headline text-[20px] text-crimson-deep mb-5">Nueva noticia</h2>
          <form id="news-form" class="space-y-4">
            <div>
              <label class="field-label" for="f-title">Título *</label>
              <input class="field-input" id="f-title" type="text" maxlength="120" required placeholder="Ej. Ordenación sacerdotal en la Catedral">
            </div>
            <div>
              <label class="field-label" for="f-caption">Texto / descripción</label>
              <textarea class="field-input" id="f-caption" maxlength="900" placeholder="Escriba el contenido de la noticia…"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="field-label" for="f-tag">Etiqueta</label>
                <select class="field-input" id="f-tag">
                  <option>Actualidad</option><option>Ministerio</option><option>Juventud</option>
                  <option>Solidaridad</option><option>Liturgia</option><option>Ambientes Seguros</option>
                  <option>Comunicado</option>
                </select>
              </div>
              <div>
                <label class="field-label" for="f-date">Fecha</label>
                <input class="field-input" id="f-date" type="date">
              </div>
            </div>
            <div>
              <label class="field-label" for="f-link">Enlace (opcional)</label>
              <input class="field-input" id="f-link" type="url" placeholder="https://www.instagram.com/arquimcbo/">
            </div>
            <div>
              <label class="field-label" for="f-photo">Foto</label>
              <input class="field-input" id="f-photo" type="file" accept="image/*">
              <img id="photo-preview" class="mt-3" alt="Vista previa">
              <p class="text-[12px] text-slate-warm/70 mt-1">La imagen se optimiza automáticamente antes de subirla.</p>
            </div>
            <p id="news-error" class="text-[13px] text-red-700 font-semibold" style="display:none"></p>
            <button class="btn-primary w-full justify-center" id="news-btn" type="submit">
              <span class="material-symbols-outlined text-[18px]">publish</span> Publicar noticia
            </button>
          </form>
        </div>
      </div>

      <!-- Lista -->
      <div class="lg:col-span-3">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-headline text-[20px] text-crimson-deep">Publicadas (<span id="count">0</span>)</h2>
          <button class="text-slate-warm hover:text-crimson-deep font-label text-[13px] font-bold flex items-center gap-1" onclick="loadList()">
            <span class="material-symbols-outlined text-[16px]">refresh</span> Actualizar
          </button>
        </div>
        <div id="news-list" class="space-y-3"></div>
        <div id="list-empty" class="text-center text-slate-warm/60 py-12 font-body" style="display:none">
          <span class="material-symbols-outlined text-4xl block mb-2">inbox</span>
          Aún no hay noticias publicadas.
        </div>
      </div>
    </div>
  </section>

</main>

<div id="stitch-footer"></div>

<div id="toast" class="toast"></div>

<script src="js/stitch-components.js"></script>
<script>StitchLayout.init({ activePage: 'noticias' });</script>
<script>
(() => {
  // Sesión sólo en memoria (no se guarda la contraseña en el navegador)
  let session = null;

  const $ = id => document.getElementById(id);
  // Lee JSON de forma segura; si el servidor no responde JSON (p. ej. 404 local),
  // devuelve un error amigable en vez de un mensaje técnico.
  async function readJson(res) {
    try { return await res.json(); }
    catch { return { error: 'No se pudo conectar con el servidor. Intente más tarde.' }; }
  }
  function toast(msg, ok = true) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(() => { t.className = 'toast ' + (ok ? 'ok' : 'err'); }, 3200);
  }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString('es-VE', { day:'numeric', month:'long', year:'numeric' }); }
    catch { return ''; }
  }

  // ── Login ──────────────────────────────────────────────
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('login-email').value.trim().toLowerCase();
    const password = $('login-pass').value;
    const btn = $('login-btn'); const err = $('login-error');
    err.style.display = 'none'; btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ loginType: 'priest', email, password })
      });
      const data = await readJson(res);
      if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo iniciar sesión.');
      const role = (data.user.role || '').toLowerCase();
      if (role !== 'admin' && role !== 'editor') {
        throw new Error('Su cuenta no tiene permiso para publicar noticias.');
      }
      session = { email, password, name: data.user.name || email, role };
      $('who').textContent = session.name;
      $('login-view').style.display = 'none';
      $('panel-view').style.display = 'block';
      const d = new Date(); $('f-date').value = d.toISOString().slice(0, 10);
      loadList();
    } catch (ex) {
      err.textContent = ex.message; err.style.display = 'block';
    } finally {
      btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">login</span> Entrar';
    }
  });

  window.logout = () => {
    session = null;
    $('panel-view').style.display = 'none';
    $('login-view').style.display = 'block';
    $('login-form').reset();
  };

  // ── Vista previa + compresión de imagen ────────────────
  let pendingImage = null; // { base64, mime }
  $('f-photo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    pendingImage = null;
    if (!file) { $('photo-preview').style.display = 'none'; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let { width, height } = img;
        if (width > MAX || height > MAX) {
          if (width >= height) { height = Math.round(height * MAX / width); width = MAX; }
          else { width = Math.round(width * MAX / height); height = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        pendingImage = { base64: dataUrl.split(',')[1], mime: 'image/jpeg' };
        const prev = $('photo-preview'); prev.src = dataUrl; prev.style.display = 'block';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  // ── Crear noticia ──────────────────────────────────────
  $('news-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!session) return;
    const err = $('news-error'); err.style.display = 'none';
    const title = $('f-title').value.trim();
    if (!title) { err.textContent = 'El título es obligatorio.'; err.style.display = 'block'; return; }
    const dateVal = $('f-date').value;
    const timestamp = dateVal ? new Date(dateVal + 'T12:00:00').toISOString() : new Date().toISOString();

    const btn = $('news-btn'); btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">hourglass_top</span> Publicando…';
    try {
      const payload = {
        email: session.email, password: session.password,
        news: {
          title,
          caption: $('f-caption').value.trim(),
          tag: $('f-tag').value,
          permalink: $('f-link').value.trim() || undefined,
          timestamp, published: true
        }
      };
      if (pendingImage) { payload.imageBase64 = pendingImage.base64; payload.imageMime = pendingImage.mime; }

      const res = await fetch('/api/noticias', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await readJson(res);
      if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo publicar.');
      toast('¡Noticia publicada!');
      $('news-form').reset(); pendingImage = null;
      $('photo-preview').style.display = 'none';
      $('f-date').value = new Date().toISOString().slice(0, 10);
      loadList();
    } catch (ex) {
      err.textContent = ex.message; err.style.display = 'block';
      toast('Error: ' + ex.message, false);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">publish</span> Publicar noticia';
    }
  });

  // ── Listar ─────────────────────────────────────────────
  window.loadList = async () => {
    const list = $('news-list');
    list.innerHTML = '<p class="text-slate-warm/60 font-body py-6 text-center">Cargando…</p>';
    try {
      const res = await fetch('/api/noticias?all=true');
      const data = await readJson(res);
      const items = data.data || [];
      $('count').textContent = items.length;
      if (!items.length) { list.innerHTML = ''; $('list-empty').style.display = 'block'; return; }
      $('list-empty').style.display = 'none';
      list.innerHTML = items.map(n => `
        <article class="bg-white rounded-xl border border-outline-variant/15 p-4 flex gap-4 items-center">
          <div class="w-20 h-20 rounded-lg bg-surface-container shrink-0 overflow-hidden">
            ${n.media_url ? `<img src="${n.media_url}" alt="" class="w-full h-full object-cover">` : '<div class="w-full h-full flex items-center justify-center text-slate-warm/40"><span class="material-symbols-outlined">image</span></div>'}
          </div>
          <div class="flex-1 min-w-0">
            <span class="font-label text-[11px] uppercase tracking-wider text-gold-antique">${n.tag || 'Actualidad'} · ${fmtDate(n.timestamp)}</span>
            <h3 class="font-headline text-[16px] text-crimson-deep leading-snug truncate">${n.title}</h3>
            <p class="font-body text-[13px] text-slate-warm line-clamp-2">${(n.caption || '').slice(0, 120)}</p>
          </div>
          <button class="text-red-700 hover:bg-red-50 rounded-lg p-2 shrink-0" title="Eliminar" onclick="removeNews('${n.id}')">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </article>`).join('');
    } catch (ex) {
      list.innerHTML = `<p class="text-red-700 font-body py-6 text-center">No se pudieron cargar las noticias.</p>`;
    }
  };

  // ── Eliminar ───────────────────────────────────────────
  window.removeNews = async (id) => {
    if (!session) return;
    if (!confirm('¿Eliminar esta noticia? Esta acción no se puede deshacer.')) return;
    try {
      const res = await fetch('/api/noticias', {
        method: 'DELETE', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: session.email, password: session.password, id })
      });
      const data = await readJson(res);
      if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo eliminar.');
      toast('Noticia eliminada.');
      loadList();
    } catch (ex) {
      toast('Error: ' + ex.message, false);
    }
  };
})();
</script>
</body></html>
